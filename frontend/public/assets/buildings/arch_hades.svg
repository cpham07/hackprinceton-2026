<svg xmlns="http://www.w3.org/2000/svg" width="230" height="300" viewBox="0 0 230 300">
  <!-- The dark arch down to Hades's chamber. Same size and proportions as its placeholder in placeholders.ts; drawn in the style of the painted backgrounds. -->
  <defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#fff1df"/><stop offset="1" stop-color="#f7c9de"/>
    </radialGradient>
  </defs>
  <g filter="url(#ink)" stroke="#2b2836" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

    <path d="M40 300 L40 104 C40 64 190 64 190 104 L190 300 Z" fill="#1a1626"/>
    
    <!-- pillars and arch stones -->
    <path d="M0 40 L40 40 L40 300 L0 300 Z" fill="#8d8a99"/>
    <path d="M190 40 L230 40 L230 300 L190 300 Z" fill="#8d8a99"/>
    <path d="M28 44 L40 44 L40 300 L28 300 Z M218 44 L230 44 L230 300 L218 300 Z" fill="#6b6878" stroke="none"/>
    <path d="M0 0 L230 0 L230 50 L190 50 C186 72 160 80 115 80 C70 80 44 72 40 50 L0 50 Z" fill="#8d8a99"/>
    <path d="M40 50 C44 72 70 80 115 80 C160 80 186 72 190 50" fill="none" stroke="#6b6878" stroke-width="6"/>
    <path d="M0 120 L40 120 M0 200 L40 200 M190 120 L230 120 M190 200 L230 200 M70 0 L70 30 M160 0 L160 30" fill="none" stroke="#6b6878" stroke-width="2"/>
    <path d="M100 66 L130 66 L126 84 L104 84 Z" fill="#8d8a99"/>
    <!-- banner -->
    <path d="M62 50 L168 50 L168 110 L115 128 L62 110 Z" fill="#4b2d7a"/>
    <path d="M62 56 L168 56" fill="none" stroke="#e0b04a" stroke-width="3"/>
    <path d="M115 102 C104 94 104 80 112 70 C112 80 116 82 116 76 C116 68 120 62 124 58 C124 70 130 78 126 90 C124 98 120 102 115 102 Z" fill="#7fe0d2" stroke="#2f9c93" stroke-width="2"/>
