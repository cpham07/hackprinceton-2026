<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480">
  <!-- The gate to Olympus (Chapter 1 and the hub), open with light beyond. Same size and proportions as its placeholder in placeholders.ts; drawn in the style of the painted backgrounds. -->
