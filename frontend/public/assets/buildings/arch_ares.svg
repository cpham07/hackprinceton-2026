      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#fff1df"/><stop offset="1" stop-color="#f7c9de"/>
    </radialGradient>
  </defs>
  <g filter="url(#ink)" stroke="#2b2836" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

    <path d="M40 300 L40 104 C40 64 190 64 190 104 L190 300 Z" fill="#5a1f1f"/>
    <path d="M48 128 L182 292 M182 128 L48 292" fill="none" stroke="#2b2836" stroke-width="16"/>
    <path d="M48 128 L182 292 M182 128 L48 292" fill="none" stroke="#7a5230" stroke-width="10"/>
    <circle cx="115" cy="210" r="9" fill="#555b66"/>
