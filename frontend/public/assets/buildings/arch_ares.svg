<svg xmlns="http://www.w3.org/2000/svg" width="230" height="300" viewBox="0 0 230 300">
  <!-- The arch to Ares's arena, barred shut. Same size and proportions as its placeholder in placeholders.ts; drawn in the style of the painted backgrounds. -->
