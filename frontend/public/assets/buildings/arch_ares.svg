    <path d="M40 50 C44 72 70 80 115 80 C160 80 186 72 190 50" fill="none" stroke="#c9ad86" stroke-width="6"/>
    <path d="M0 120 L40 120 M0 200 L40 200 M190 120 L230 120 M190 200 L230 200 M70 0 L70 30 M160 0 L160 30" fill="none" stroke="#c9ad86" stroke-width="2"/>
