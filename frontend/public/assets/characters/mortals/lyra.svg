    <circle cx="54" cy="29" r="2" fill="#2b2836" stroke="none"/>
    <path d="M38 24 L45 23 M51 23 L58 24" fill="none" stroke="#4a2f1b" stroke-width="1.8"/>
    <path d="M43 38 C46 41 50 41 53 38" fill="none" stroke="#b5574a" stroke-width="2"/>
