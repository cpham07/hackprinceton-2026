<svg xmlns="http://www.w3.org/2000/svg" width="96" height="160" viewBox="0 0 96 160">
  <!-- Lyra the young scholar, who teaches the incantation (placeholder 48x80, drawn at 2x). Drawn to match chapter1_bg.webp: bold dark outlines, flat warm colours, light ink wobble. -->
